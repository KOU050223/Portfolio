name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Check formatting with oxfmt
        run: npm run format:check

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Build application (PR)
        if: github.event_name == 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production

      - name: Build application (push)
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PROJECTS_DATA_SOURCE_ID: ${{ secrets.NOTION_PROJECTS_DATA_SOURCE_ID }}
          NOTION_CAREER_DATA_SOURCE_ID: ${{ secrets.NOTION_CAREER_DATA_SOURCE_ID }}

      - name: Upload build artifacts
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v5
        with:
          name: build-files
          path: |
            .next/
            out/
          retention-days: 7

  # ビルド成功時の通知（オプション）
  notify-success:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Notify build success
        run: echo "Build and tests passed successfully!"

  # ビルド失敗時の通知（オプション）
  notify-failure:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Notify build failure
        run: echo "Build or tests failed!"
